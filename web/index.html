<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Yerel Yapay Zeka</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.0.379/pdf.min.js"></script>
<style>
  :root {
    --bg: #0f1117; --panel: #1a1d27; --text: #e8e8ec; --muted: #8b8fa3;
    --accent: #6c8cff; --border: #2a2d3a;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; font-family: -apple-system, system-ui, sans-serif;
    background: var(--bg); color: var(--text); height: 100vh;
    display: flex; flex-direction: column;
  }
  header {
    padding: 14px 18px; border-bottom: 1px solid var(--border);
    display: flex; align-items: center; justify-content: space-between;
  }
  header h1 { font-size: 16px; margin: 0; font-weight: 600; }
  #status { font-size: 12px; color: var(--muted); }
  #chat { flex: 1; overflow-y: auto; padding: 18px; display: flex; flex-direction: column; gap: 12px; }
  .msg { max-width: 80%; padding: 10px 14px; border-radius: 12px; line-height: 1.5; white-space: pre-wrap; }
  .msg.user { align-self: flex-end; background: var(--accent); color: white; }
  .msg.ai { align-self: flex-start; background: var(--panel); border: 1px solid var(--border); }
  .msg.system { align-self: center; background: transparent; color: var(--muted); font-size: 13px; }
  footer { padding: 14px; border-top: 1px solid var(--border); display: flex; gap: 8px; }
  #promptInput {
    flex: 1; padding: 10px 14px; border-radius: 10px; border: 1px solid var(--border);
    background: var(--panel); color: var(--text); font-size: 14px;
  }
  button {
    padding: 10px 16px; border-radius: 10px; border: none; background: var(--accent);
    color: white; font-size: 14px; cursor: pointer;
  }
  button:disabled { opacity: 0.5; cursor: not-allowed; }
  button.secondary { background: var(--panel); border: 1px solid var(--border); color: var(--text); }
  #loadBar { font-size: 12px; color: var(--muted); padding: 0 18px; }
</style>
</head>
<body>

<header>
  <h1>🧠 Yerel Yapay Zeka</h1>
  <div style="display:flex; align-items:center; gap:10px;">
    <span id="status">Model yükleniyor...</span>
    <button id="adminLoginBtn" class="secondary" title="Admin girişi" style="font-size:11px; padding:4px 8px;">🔒 Admin</button>
    <button id="downloadTeachingsBtn" class="secondary" style="display:none; font-size:11px; padding:4px 8px;" title="Öğretilenleri indir">📥 Öğretilenler (<span id="teachingCount">0</span>)</button>
    <button id="clearCacheBtn" class="secondary" title="Modeli güncellediysen kullan" style="font-size:11px; padding:4px 8px;">🗑️ Önbelleği temizle</button>
  </div>
</header>

<div id="memoryBar" style="padding: 8px 18px; font-size: 12px; color: var(--muted); border-bottom: 1px solid var(--border); display:flex; align-items:center; gap:10px;">
  <label for="fileInput" style="cursor:pointer; background: var(--panel); border:1px solid var(--border); padding:6px 10px; border-radius:8px;">
    📄 PDF/TXT ekle
  </label>
  <input id="fileInput" type="file" accept=".pdf,.txt,.md" multiple style="display:none;" />
  <span id="memoryStatus">Hafızada belge yok</span>
  <label style="margin-left:auto; display:flex; align-items:center; gap:6px; cursor:pointer;">
    <input id="autoSearchToggle" type="checkbox" checked />
    🔍 Her mesajda otomatik ara
  </label>
</div>

<div id="loadBar"></div>

<div id="chat">
  <div class="msg system">AI sunucusuna bağlanılıyor, birkaç saniye sürebilir...</div>
</div>

<footer>
  <input id="promptInput" type="text" placeholder="Bir şey yaz..." disabled />
  <button id="researchBtn" class="secondary" disabled title="İnternette ara">🔍</button>
  <button id="cancelBtn" class="secondary" style="display:none; background:#4a2323; border-color:#6b3535;" title="Devam eden isteği iptal et">✕ İptal</button>
  <button id="sendBtn" disabled>Gönder</button>
</footer>

<script type="module">
  import { runResearch } from "./js/research-agent.js";
  import { extractTextFromFile } from "./js/pdf-reader.js";
  import { VectorMemory } from "./js/vector-memory.js";

  // PDF.js'in arka plan iş parçacığı (worker) dosyası - CDN'den
  if (window.pdfjsLib) {
    window.pdfjsLib.GlobalWorkerOptions.workerSrc =
      "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.0.379/pdf.worker.min.js";
  }

  const memory = new VectorMemory();
  const fileInput = document.getElementById("fileInput");
  const memoryStatus = document.getElementById("memoryStatus");

  fileInput.addEventListener("change", async (e) => {
    const files = Array.from(e.target.files);
    for (const file of files) {
      memoryStatus.textContent = `${file.name} okunuyor...`;
      try {
        const text = await extractTextFromFile(file);
        const chunkCount = memory.addDocument(file.name, text);
        addMessage(`📄 "${file.name}" hafızaya eklendi (${chunkCount} parça).`, "system");
      } catch (err) {
        addMessage(`❌ "${file.name}" okunamadı: ${err.message}`, "system");
      }
    }
    memoryStatus.textContent =
      memory.documentCount > 0
        ? `${memory.documentCount} belge, ${memory.chunkCount} parça hafızada`
        : "Hafızada belge yok";
    fileInput.value = ""; // aynı dosyayı tekrar seçebilmek için
  });

  const chatEl = document.getElementById("chat");
  const statusEl = document.getElementById("status");
  const loadBarEl = document.getElementById("loadBar");
  const inputEl = document.getElementById("promptInput");
  const adminLoginBtn = document.getElementById("adminLoginBtn");
  const downloadTeachingsBtn = document.getElementById("downloadTeachingsBtn");
  const teachingCountEl = document.getElementById("teachingCount");
  const sendBtn = document.getElementById("sendBtn");
  const researchBtn = document.getElementById("researchBtn");
  const cancelBtn = document.getElementById("cancelBtn");

  // Devam eden bir isteği iptal edebilmek için basit bir "iptal jetonu".
  // Her yeni istekte taze bir nesne oluşturuyoruz (önceki isteğin iptal
  // butonuna geç basılması yeni isteği etkilemesin diye); arama ağ
  // istekleri AbortController.signal ile, model üretimi ise onToken
  // callback'inin döngüyü kırmasıyla (bkz. model.js generate()) durdurulur.
  let activeCancelToken = null;

  function beginRequest() {
    const controller = new AbortController();
    const token = { cancelled: false, controller };
    activeCancelToken = token;
    cancelBtn.style.display = "inline-block";
    return token;
  }

  function endRequest(token) {
    if (activeCancelToken === token) {
      activeCancelToken = null;
      cancelBtn.style.display = "none";
    }
  }

  cancelBtn.addEventListener("click", () => {
    if (activeCancelToken) {
      activeCancelToken.cancelled = true;
      activeCancelToken.controller.abort();
    }
  });

  function addMessage(text, cls) {
    const div = document.createElement("div");
    div.className = `msg ${cls}`;
    div.textContent = text;
    chatEl.appendChild(div);
    chatEl.scrollTop = chatEl.scrollHeight;
    return div;
  }

  // ============== ADMIN GİRİŞİ VE "Öğret->" KOMUTU ==============
  //
  // ÖNEMLİ DÜRÜSTLÜK NOTU: Bu site tamamen statik (GitHub Pages, sunucu
  // yok). Bu yüzden bu şifre kontrolü GERÇEK GÜVENLİK DEĞİL - sayfa
  // kaynağını görüntüleyen HERKES bu şifreyi düz metin olarak görebilir.
  // Bu sadece "rastgele bir ziyaretçi yanlışlıkla admin komutu yazmasın"
  // seviyesinde basit bir engel. Gerçekten önemli/gizli bir şifre KULLANMA.
  const ADMIN_PASSWORD = "admin123"; // <-- unutma: bu gerçek güvenlik değil, sadece basit bir engel

  let isAdmin = false;
  const TEACHINGS_KEY = "adminTeachings";

  function loadTeachings() {
    try {
      return JSON.parse(localStorage.getItem(TEACHINGS_KEY) || "[]");
    } catch {
      return [];
    }
  }

  function saveTeachings(list) {
    localStorage.setItem(TEACHINGS_KEY, JSON.stringify(list));
    teachingCountEl.textContent = String(list.length);
    downloadTeachingsBtn.style.display = list.length > 0 ? "inline-block" : "none";
  }

  adminLoginBtn.addEventListener("click", () => {
    if (isAdmin) {
      isAdmin = false;
      adminLoginBtn.textContent = "🔒 Admin";
      addMessage("Admin modundan çıkıldı.", "system");
      return;
    }
    const pw = prompt("Admin şifresi:");
    if (pw === null) return;
    if (pw === ADMIN_PASSWORD) {
      isAdmin = true;
      adminLoginBtn.textContent = "🔓 Admin (aktif)";
      addMessage(
        "✅ Admin modu aktif. Model'e bir şey öğretmek için mesajını " +
          '"Öğret->" ile başlat.\n\n' +
          "İki format kullanabilirsin:\n" +
          '1) Soru-cevap: "Öğret-> nasılsın => İyiyim, sen nasılsın?"\n' +
          '2) Genel bilgi/metin: "Öğret-> Ankara Türkiye\'nin başkentidir ve..."\n\n' +
          "Öğrettiklerin tarayıcında biriktirilir, üstteki 📥 butonuyla " +
          "indirip Colab'daki eğitim defterine atabilirsin.",
        "system"
      );
      saveTeachings(loadTeachings()); // sayaç/buton görünürlüğünü güncelle
    } else {
      addMessage("❌ Yanlış şifre.", "system");
    }
  });

  downloadTeachingsBtn.addEventListener("click", () => {
    const list = loadTeachings();
    const blob = new Blob([JSON.stringify(list, null, 2)], { type: "application/json" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = "admin_egitim_verisi.json";
    a.click();
    URL.revokeObjectURL(url);
  });

  /**
   * "Öğret-> ..." komutunu işler. `=>` varsa soru/cevap çifti olarak,
   * yoksa serbest metin (genel bilgi) olarak kaydeder. Model bu kaydı
   * ANINDA öğrenmez - sadece daha sonra Colab'da yeniden eğitim için
   * biriktirir (bkz. index.html'in üstündeki dürüstlük notu ve daha önce
   * konuştuğumuz "canlı öğrenme küçük modeli bozar" riski).
   */
  function handleTeachCommand(rawContent) {
    const list = loadTeachings();
    const sepIdx = rawContent.indexOf("=>");
    if (sepIdx !== -1) {
      const soru = rawContent.slice(0, sepIdx).trim();
      const cevap = rawContent.slice(sepIdx + 2).trim();
      if (!soru || !cevap) {
        addMessage('⚠️ Format hatalı. Örnek: "Öğret-> soru metni => cevap metni"', "system");
        return;
      }
      list.push({ type: "qa", soru, cevap, ts: Date.now() });
    } else {
      const content = rawContent.trim();
      if (!content) {
        addMessage("⚠️ Öğret-> yazdın ama içerik boş.", "system");
        return;
      }
      list.push({ type: "text", content, ts: Date.now() });
    }
    saveTeachings(list);
    addMessage(`✅ Kaydedildi (toplam ${list.length} örnek). Eğitime dahil etmek için 📥 ile indir.`, "system");
  }

  // Model artık tarayıcıda çalışmıyor. V9, Node.js API sunucusunda çalışıyor.
  // Yerel testte http://localhost:3000; gerçek yayında burayı kendi API adresinle değiştir.
  const AI_API_URL = "http://localhost:3000";
  let model = false;

  async function init() {
    statusEl.textContent = "AI sunucusu kontrol ediliyor...";
    loadBarEl.textContent = "";
    try {
      const health = await fetch(`${AI_API_URL}/health`, { cache: "no-store" });
      if (!health.ok) throw new Error(`HTTP ${health.status}`);
      const data = await health.json();
      if (!data.ok || !data.modelLoaded) throw new Error("V9 modeli hazır değil.");

      model = true;
      statusEl.textContent = "AI hazır ✅";
      inputEl.disabled = false;
      sendBtn.disabled = false;
      researchBtn.disabled = false;
      addMessage("AI sunucusu hazır. Bir şey sorabilirsin.", "system");
    } catch (err) {
      model = false;
      statusEl.textContent = "AI sunucusuna bağlanılamadı ❌";
      addMessage(`AI sunucusu hazır değil: ${err.message}`, "system");
    }
  }

  // ============== KRİZ GÜVENLİK KONTROLÜ ==============
  // ÖNEMLİ: Bu kontrol MODELİN KALİTESİNE BAĞLI DEĞİL - küçük model ne
  // kadar tutarsız/kötü olursa olsun bu her zaman çalışır. Ciddi bir
  // ifade tespit edilirse, ARAMA ÖZELLİĞİ DE DEVREYE GİRMEZ (önceden
  // "ölmek istiyorum" yazınca site bunu internette aratıp TRT Haber
  // haberlerini gösteriyordu - bu tehlikeliydi, şimdi arama da tamamen
  // atlanıyor). Bu basit bir anahtar-kelime kontrolü, kusursuz değil,
  // ama sabit ve güvenilir bir son çare (fallback) katmanı.
  const CRISIS_KEYWORDS = [
    "yaşamak istemiyorum", "kendime zarar vermek istiyorum",
    "hayatımı sonlandırmak istiyorum", "kendimi öldürmek istiyorum",
    "intihar etmek istiyorum", "artık dayanamıyorum",
    "yaşamın anlamı yok", "ölmek istiyorum", "pes ettim",
  ];
  const CRISIS_SAFE_ANSWER =
    "Bunu duyduğuma çok üzüldüm, bunun senin için ne kadar ağır olabileceğini " +
    "tahmin edebiliyorum. Ben küçük ve basit bir yapay zekayım, bu konuda " +
    "gerçek bir yardım sağlayamam. Lütfen hemen güvendiğin bir yakınınla " +
    "konuş, bir ruh sağlığı uzmanından destek al, ya da acil bir durumdaysan " +
    "112'yi arayarak ya da en yakın sağlık kuruluşuna giderek yardım iste. " +
    "Yalnız değilsin ve konuşabileceğin insanlar var.";

  function isCrisisMessage(text) {
    const lower = text.toLowerCase();
    return CRISIS_KEYWORDS.some((kw) => lower.includes(kw));
  }

  async function handleSend() {
    const prompt = inputEl.value.trim();
    if (!prompt || !model) return;

    addMessage(prompt, "user");
    inputEl.value = "";

    // Admin modundayken "Öğret->" ile başlayan mesajlar normal sohbete
    // GİRMEZ - sadece veri olarak kaydedilir (model şu an bunu öğrenmiyor,
    // sadece daha sonra Colab'da yeniden eğitim için biriktiriliyor).
    const TEACH_PREFIX = "öğret->";
    if (isAdmin && prompt.toLowerCase().startsWith(TEACH_PREFIX)) {
      handleTeachCommand(prompt.slice(TEACH_PREFIX.length));
      return;
    }

    // Kriz kontrolü EN BAŞTA yapılır - arama da, model üretimi de HİÇ
    // ÇALIŞTIRILMAZ, doğrudan sabit güvenli cevap gösterilir.
    if (isCrisisMessage(prompt)) {
      addMessage(CRISIS_SAFE_ANSWER, "ai");
      return;
    }

    sendBtn.disabled = true;

    const aiDiv = addMessage("...", "ai");
    const cancelToken = beginRequest();

    // UI'ı kilitlememek için üretim bir sonraki "tick"e ertelenir
    await new Promise((r) => setTimeout(r, 10));

    const contextParts = [];
    let searchSources = [];
    let searchSummary = "";
    let memorySummary = "";

    // 1) Otomatik internet araması (açıksa) - DuckDuckGo'dan gelen, gerçek
    // kaynağa dayanan (extractive) özet - modelin "ezberi" değil, o an
    // internetten bulunan gerçek metin.
    if (autoSearchToggle.checked) {
      aiDiv.textContent = "Düşünülüyor... (iptal edebilirsin)";
      try {
        const report = await runResearch(prompt, { signal: cancelToken.controller.signal });
        if (report.sources.length > 0) {
          searchSummary = report.summary;
          contextParts.push(report.summary);
          searchSources = report.sources;
        }
      } catch (err) {
        if (cancelToken.cancelled) {
          aiDiv.textContent = "İptal edildi.";
          endRequest(cancelToken);
          sendBtn.disabled = false;
          return;
        }
        // Arama başarısız olursa sohbete devam ediyoruz (model kendi
        // bilgisiyle cevap vermeye çalışır) ama HATAYI ARTIK GİZLEMİYORUZ -
        // önceden burası tamamen sessizdi, bu da "🔍 neden hiç çalışmıyor"
        // sorusunu teşhis etmeyi imkansız kılıyordu.
        addMessage(`⚠️ Arama başarısız: ${err.message}`, "system");
      }
    }

    if (cancelToken.cancelled) {
      aiDiv.textContent = "İptal edildi.";
      endRequest(cancelToken);
      sendBtn.disabled = false;
      return;
    }

    // 2) Yüklenmiş PDF/TXT hafızası varsa, alakalı parçaları da ekle
    if (memory.chunkCount > 0) {
      const relevant = memory.search(prompt, 2);
      if (relevant.length > 0 && relevant[0].score > 0.05) {
        memorySummary = relevant.map((r) => `- ${r.text} [${r.docName}]`).join("\n");
        contextParts.push(memorySummary);
      }
    }

    // ÖNEMLİ: arama/hafıza bir şey bulsa BİLE modeli hep çalıştırıyoruz -
    // artık "arama zaten iyi bir sonuç buldu, modelin yorumunu tamamen
    // gizle" davranışı yok. Bulunan bilgi ile modelin kendi (ezberlediği/
    // öğrendiği) yorumu HER ZAMAN ayrı ayrı, birlikte gösteriliyor;
    // hangisinin kaynaklı/gerçek hangisinin spekülatif olduğu net kalsın
    // diye etiketler duruyor.
    aiDiv.textContent = "Düşünülüyor... (iptal edebilirsin)";

    try {
      let modelText = "";

      // ÖNEMLİ: prompt'u HER ZAMAN aynı şablonla sarıyoruz - bağlam olsun
      // ya da olmasın. v9'dan itibaren model "Düşünce:" adımıyla eğitildi
      // (bkz. eğitim defteri, USE_THOUGHT_STEP) - önce soruyu kısaca
      // sınıflandırıp SONRA cevap veriyor. Kullanıcıya sadece "Cevap:"
      // sonrasını gösteriyoruz, "Düşünce:" kısmı arka planda kalıyor.
      const USE_THOUGHT_STEP = true; // eğitim defterindeki değerle SENKRON tut
      const finalPrompt =
        contextParts.length > 0
          ? `Bağlam:\n${contextParts.join("\n\n")}\n\nSoru: ${prompt}\n${USE_THOUGHT_STEP ? "Düşünce:" : "Cevap:"}`
          : `Soru: ${prompt}\n${USE_THOUGHT_STEP ? "Düşünce:" : "Cevap:"}`;

      // V9 artık tarayıcıda generate() etmiyor; hazır promptu Node.js API'ye gönderiyoruz.
      const response = await fetch(`${AI_API_URL}/api/chat`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ prompt: finalPrompt }),
        signal: cancelToken.controller.signal,
      });

      if (!response.ok) {
        const detail = await response.text().catch(() => "");
        throw new Error(`AI sunucusu HTTP ${response.status}${detail ? `: ${detail}` : ""}`);
      }

      const data = await response.json();
      if (!data.response) throw new Error("AI sunucusundan geçerli cevap gelmedi.");
      modelText = String(data.response).trim() || "(boş çıktı)";

      // Cevabı açıkça etiketlenmiş bölümler olarak sunuyoruz: (a) internetten/
      // belgeden BULUNAN gerçek bilgi (güvenilir, kaynaklı) (b) küçük
      // modelin kendi yorumu (spekülatif olabilir). Bunları karıştırıp tek
      // bir "cevap" gibi sunmak, hangisinin gerçek kaynağa dayandığını
      // gizleyip yanıltıcı olurdu.
      const sections = [];

      if (searchSummary || memorySummary) {
        const foundParts = [searchSummary, memorySummary].filter(Boolean).join("\n");
        sections.push(`📚 Bulunan bilgiler:\n${foundParts}`);
      }

      sections.push(`🤖 Cevap:\n${modelText}`);

      if (searchSources.length > 0) {
        const sourceList = searchSources
          .map((s) => `• ${s.title} (${s.url})`)
          .join("\n");
        sections.push(`--- Kaynaklar ---\n${sourceList}`);
      }

      const finalText = sections.join("\n\n");

      aiDiv.textContent = finalText;
    } catch (err) {
      aiDiv.textContent = `Hata: ${err.message}`;
    } finally {
      endRequest(cancelToken);
      sendBtn.disabled = false;
    }
  }

  async function handleResearch() {
    const query = inputEl.value.trim();
    if (!query) return;

    addMessage(`🔍 Aranıyor: ${query}`, "user");
    inputEl.value = "";
    researchBtn.disabled = true;

    const aiDiv = addMessage("Araştırılıyor...", "ai");

    try {
      const report = await runResearch(query);
      const sourceList = report.sources.map((s) => `• ${s.title} (${s.url})`).join("\n");
      aiDiv.textContent = `${report.summary}\n\n--- Kaynaklar ---\n${sourceList || "(yok)"}`;
    } catch (err) {
      aiDiv.textContent = `Arama hatası: ${err.message}\n\nproxy/worker.js kurulumunu ve research-agent.js içindeki PROXY_URL'i kontrol et.`;
    } finally {
      researchBtn.disabled = false;
    }
  }

  sendBtn.addEventListener("click", handleSend);
  researchBtn.addEventListener("click", handleResearch);
  inputEl.addEventListener("keydown", (e) => {
    if (e.key === "Enter") handleSend();
  });

  // Service Worker normal site önbelleği için kullanılmaya devam ediyor; AI modeli artık tarayıcıya indirilmez.
  if ("serviceWorker" in navigator) {
    navigator.serviceWorker.register("./sw.js").catch((err) => {
      console.warn("Service Worker kaydedilemedi (site yine de çalışır):", err);
    });
  }

  // "Önbelleği temizle" butonu: modeli yeniden eğitip dosyaları
  // güncellediğinde, tarayıcının eski (önbellekteki) modeli göstermeye
  // devam etmesini önlemek için kullanılır.
  document.getElementById("clearCacheBtn").addEventListener("click", async () => {
    if (!confirm("Önbellek temizlenecek ve sayfa yeniden yüklenecek. Devam edilsin mi?")) return;
    if ("caches" in window) {
      const names = await caches.keys();
      await Promise.all(names.map((n) => caches.delete(n)));
    }
    if ("serviceWorker" in navigator) {
      const regs = await navigator.serviceWorker.getRegistrations();
      await Promise.all(regs.map((r) => r.unregister()));
    }
    location.reload(true);
  });

  saveTeachings(loadTeachings()); // sayfa yenilense bile önceki (indirilmemiş) öğretileri göster
  init();
</script>

</body>
</html>
